<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760">
  <defs>
    <style>
      .bg { fill: #fbfbf4; }
      .title { font: 800 34px Arial, Helvetica, sans-serif; fill: #18362c; }
      .subtitle { font: 500 18px Arial, Helvetica, sans-serif; fill: #5f706a; }
      .panel-title { font: 800 22px Arial, Helvetica, sans-serif; letter-spacing: 1.6px; }
      .box-title { font: 800 22px Arial, Helvetica, sans-serif; fill: #19372e; }
      .box-body { font: 500 16px Arial, Helvetica, sans-serif; fill: #53645e; }
      .small { font: 700 15px Arial, Helvetica, sans-serif; fill: #58706a; }
      .chip { font: 800 16px Arial, Helvetica, sans-serif; fill: #234d40; }
      .edge { stroke: #5f6d68; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .soft-edge { stroke: #8a9b95; stroke-width: 2.4; fill: none; marker-end: url(#arrowSoft); }
      .panel { stroke-width: 2; rx: 26; }
    </style>

    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5f6d68"/>
    </marker>
    <marker id="arrowSoft" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a9b95"/>
    </marker>
  </defs>

  <rect class="bg" width="1280" height="760"/>
  <rect x="0" y="0" width="1280" height="760" fill="url(#grid)" opacity="0.18"/>

  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#d9e6dc" stroke-width="1"/>
    </pattern>
  </defs>

  <text x="48" y="54" class="title">RewindAI Agent-Grounded Graph Framework</text>
  <text x="48" y="84" class="subtitle">Natural dialogue is converted into relationship graphs, decision logic, and reflection support for campus decision simulations.</text>

  <!-- Input panel -->
  <rect x="48" y="122" width="215" height="450" rx="28" fill="#f4f8ee" stroke="#b8d5bf" stroke-width="2"/>
  <text x="78" y="164" class="panel-title" fill="#2f7c5d">INPUTS</text>

  <rect x="76" y="197" width="160" height="92" rx="20" fill="#ffffff" stroke="#b7d5bf" stroke-width="2"/>
  <circle cx="108" cy="228" r="17" fill="#dff2e8" stroke="#4b936e" stroke-width="2"/>
  <path d="M99 228 C99 218 117 218 117 228 M100 238 C105 231 112 231 117 238" stroke="#2b6e52" stroke-width="3" fill="none" stroke-linecap="round"/>
  <text x="128" y="224" class="box-title" font-size="20">Stories</text>
  <text x="128" y="249" class="box-body">turning points</text>
  <text x="128" y="270" class="box-body">and trade-offs</text>

  <rect x="76" y="320" width="160" height="92" rx="20" fill="#ffffff" stroke="#b7d5bf" stroke-width="2"/>
  <circle cx="108" cy="351" r="17" fill="#ecf6ff" stroke="#5c98c8" stroke-width="2"/>
  <path d="M100 344 L116 344 L116 358 L100 358 Z M104 348 L112 348 M104 353 L112 353" stroke="#337099" stroke-width="2.6" fill="none" stroke-linecap="round"/>
  <text x="128" y="347" class="box-title" font-size="20">Trace</text>
  <text x="128" y="372" class="box-body">simulation-test</text>
  <text x="128" y="393" class="box-body">choices</text>

  <rect x="76" y="443" width="160" height="82" rx="20" fill="#fff8e6" stroke="#dfc979" stroke-width="2"/>
  <text x="102" y="477" class="box-title" font-size="20">Feedback</text>
  <text x="102" y="502" class="box-body">brief user notes</text>

  <!-- Agent layer -->
  <rect x="330" y="122" width="330" height="450" rx="28" fill="#eef8f0" stroke="#96c5a5" stroke-width="2.2"/>
  <text x="360" y="164" class="panel-title" fill="#2f7c5d">AGENT LAYER</text>

  <rect x="365" y="196" width="260" height="78" rx="20" fill="#dff2e8" stroke="#5ca47a" stroke-width="2"/>
  <text x="390" y="229" class="box-title">Session Coordinator</text>
  <text x="390" y="253" class="box-body">plans 3 natural topics</text>
  <text x="390" y="272" class="box-body">and keeps a 20-turn flow</text>

  <rect x="365" y="294" width="260" height="78" rx="20" fill="#ffffff" stroke="#98cdae" stroke-width="2"/>
  <text x="390" y="327" class="box-title">Interviewer Agent</text>
  <text x="390" y="351" class="box-body">mirrors and probes values,</text>
  <text x="390" y="370" class="box-body">boundaries, and risk</text>

  <rect x="365" y="392" width="260" height="78" rx="20" fill="#ffffff" stroke="#98cdae" stroke-width="2"/>
  <text x="390" y="425" class="box-title">Biography Writer</text>
  <text x="390" y="449" class="box-body">writes a decision-centered profile</text>

  <rect x="365" y="490" width="260" height="56" rx="20" fill="#f6fbf4" stroke="#98cdae" stroke-width="2"/>
  <text x="390" y="525" class="box-title">Reflection Agent</text>

  <!-- Graph layer -->
  <rect x="727" y="122" width="465" height="450" rx="28" fill="#f0f6ff" stroke="#9db9df" stroke-width="2.2"/>
  <text x="757" y="164" class="panel-title" fill="#315aa0">GRAPH + MODEL LAYER</text>

  <rect x="762" y="197" width="178" height="96" rx="20" fill="#ffffff" stroke="#9db9df" stroke-width="2"/>
  <text x="786" y="231" class="box-title">Relationship</text>
  <text x="786" y="256" class="box-title">Graph</text>
  <text x="786" y="279" class="box-body">roles and obligations</text>

  <rect x="980" y="197" width="178" height="96" rx="20" fill="#fff8e6" stroke="#dfc979" stroke-width="2"/>
  <text x="1004" y="231" class="box-title">Decision</text>
  <text x="1004" y="256" class="box-title">Logic Graph</text>
  <text x="1004" y="279" class="box-body">values and rules</text>

  <rect x="822" y="430" width="276" height="96" rx="22" fill="#eef2ff" stroke="#9aa9e8" stroke-width="2"/>
  <text x="855" y="466" class="box-title">Mental Model Draft</text>
  <text x="855" y="492" class="box-body">if-then patterns, decision boundaries,</text>
  <text x="855" y="513" class="box-body">and counterfactual variables</text>

  <!-- Mini graph motif -->
  <circle cx="960" cy="346" r="28" fill="#61bd6d" stroke="#276c3b" stroke-width="2"/>
  <text x="940" y="352" class="small" fill="#ffffff">self</text>
  <circle cx="835" cy="352" r="22" fill="#6bb8e8" stroke="#337099" stroke-width="2"/>
  <circle cx="1080" cy="352" r="22" fill="#f0a832" stroke="#a36615" stroke-width="2"/>
  <circle cx="905" cy="386" r="22" fill="#d9569a" stroke="#8f3166" stroke-width="2"/>
  <circle cx="1018" cy="386" r="22" fill="#865ce6" stroke="#5638a7" stroke-width="2"/>
  <line x1="932" y1="346" x2="857" y2="352" stroke="#73849a" stroke-width="3"/>
  <line x1="988" y1="346" x2="1058" y2="352" stroke="#73849a" stroke-width="3"/>
  <line x1="946" y1="370" x2="921" y2="384" stroke="#73849a" stroke-width="3"/>
  <line x1="974" y1="370" x2="1001" y2="384" stroke="#73849a" stroke-width="3"/>
  <text x="790" y="388" class="small">roles</text>
  <text x="1050" y="388" class="small">events</text>
  <text x="865" y="424" class="small">pressure</text>
  <text x="994" y="424" class="small">rules</text>

  <!-- Support loop -->
  <rect x="245" y="612" width="790" height="106" rx="28" fill="#fffdf3" stroke="#ddc975" stroke-width="2.2"/>
  <text x="286" y="648" class="panel-title" fill="#9a6a1b">SUPPORT LOOP</text>
  <rect x="610" y="629" width="98" height="42" rx="18" fill="#ffffff" stroke="#d7c56f" stroke-width="2"/>
  <text x="633" y="657" class="chip">Run 1</text>
  <rect x="754" y="629" width="178" height="42" rx="18" fill="#f4fbf6" stroke="#95c5a4" stroke-width="2"/>
  <text x="777" y="657" class="chip">Reflection</text>
  <rect x="974" y="629" width="98" height="42" rx="18" fill="#ffffff" stroke="#d7c56f" stroke-width="2"/>
  <text x="997" y="657" class="chip">Run 2</text>
  <path d="M708 650 L747 650" class="soft-edge"/>
  <path d="M932 650 L967 650" class="soft-edge"/>
  <text x="286" y="695" class="box-body">Baseline conditions: self notes, generic AI reflection, RewindAI clone support, or anonymous demo.</text>

  <!-- Main connectors -->
  <path d="M263 312 C288 312 303 312 330 312" class="edge"/>
  <path d="M660 312 C690 312 703 312 727 312" class="edge"/>
  <path d="M495 572 L495 612" class="soft-edge"/>
  <path d="M960 572 L960 612" class="soft-edge"/>

  <!-- Compact evidence note -->
  <rect x="1056" y="612" width="136" height="106" rx="24" fill="#f5f0ff" stroke="#b8a1df" stroke-width="2"/>
  <text x="1074" y="651" class="box-title" font-size="20">Evidence</text>
  <text x="1074" y="678" class="box-body">confirmed story</text>
  <text x="1074" y="700" class="box-body">+ trace signals</text>
</svg>
