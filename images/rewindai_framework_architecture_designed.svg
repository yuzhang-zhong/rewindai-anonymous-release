<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">RewindAI Architecture</title>
  <desc id="desc">A designed framework architecture figure for RewindAI, with colored module blocks, condition groups, autobiographical grounding, simulation loop, and research data/admin layer.</desc>
  <defs>
    <marker id="arrowDark" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,4 L0,8 Z" fill="#4d5662"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,4 L0,8 Z" fill="#2f6d52"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,4 L0,8 Z" fill="#345aa8"/>
    </marker>
    <marker id="arrowTeal" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,4 L0,8 Z" fill="#1c6870"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,4 L0,8 Z" fill="#7a4b9a"/>
    </marker>
    <filter id="softShadow" x="-12%" y="-20%" width="124%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#24342d" flood-opacity=".10"/>
    </filter>
    <style>
      .title { font: 700 28px Arial, Helvetica, sans-serif; fill: #111827; }
      .section-title { font: 700 18px Arial, Helvetica, sans-serif; letter-spacing: .3px; }
      .node-title { font: 700 16px Arial, Helvetica, sans-serif; fill: #121826; }
      .node-title-white { font: 700 16px Arial, Helvetica, sans-serif; fill: #ffffff; }
      .node-small { font: 400 11px Arial, Helvetica, sans-serif; fill: #536160; }
      .node-small-white { font: 400 11px Arial, Helvetica, sans-serif; fill: #eef7f4; }
      .edge-label { font: 400 12px Arial, Helvetica, sans-serif; fill: #20242b; }
      .note { font: 400 11px Arial, Helvetica, sans-serif; fill: #646b73; }
      .frame { fill: #ffffff; stroke: #b9c1c9; stroke-width: 1.2; rx: 10; ry: 10; }
      .frame-entry { fill: #f5fbf7; stroke: #b9cfc2; }
      .frame-ground { fill: #f5f8ff; stroke: #b7c8ec; }
      .frame-sim { fill: #f4fbfb; stroke: #b4d7dc; }
      .node { stroke-width: 1.7; rx: 10; ry: 10; filter: url(#softShadow); }
      .green { fill: #ffffff; stroke: #24663f; }
      .green-fill { fill: #dff3e7; stroke: #24663f; }
      .blue { fill: #ffffff; stroke: #2d55aa; }
      .blue-fill { fill: #dfeaff; stroke: #2d55aa; }
      .teal { fill: #ffffff; stroke: #1d6871; }
      .teal-fill { fill: #dff5f4; stroke: #1d6871; }
      .amber-fill { fill: #fff0ca; stroke: #a56a12; }
      .purple { fill: #ffffff; stroke: #7b4aa0; }
      .purple-fill { fill: #efe5ff; stroke: #7b4aa0; }
      .edge { fill: none; stroke: #4d5662; stroke-width: 1.55; marker-end: url(#arrowDark); }
      .edge-green { fill: none; stroke: #2f6d52; stroke-width: 1.6; marker-end: url(#arrowGreen); }
      .edge-blue { fill: none; stroke: #345aa8; stroke-width: 1.6; marker-end: url(#arrowBlue); }
      .edge-teal { fill: none; stroke: #1c6870; stroke-width: 1.6; marker-end: url(#arrowTeal); }
      .edge-purple { fill: none; stroke: #7a4b9a; stroke-width: 1.6; marker-end: url(#arrowPurple); }
      .edge-soft { fill: none; stroke: #747b84; stroke-width: 1.35; marker-end: url(#arrowDark); }
      .edge-dash { fill: none; stroke: #747b84; stroke-width: 1.35; stroke-dasharray: 6 5; marker-end: url(#arrowDark); }
      .icon { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; opacity: .82; }
      .igreen { color: #2d6a4f; }
      .iblue { color: #2d55aa; }
      .iteal { color: #1d6871; }
      .ipurple { color: #7b4aa0; }
      .iamber { color: #a56a12; }
      .badge { font: 700 18px Arial, Helvetica, sans-serif; fill: #ffffff; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="#ffffff"/>
  <text class="title" x="22" y="42">RewindAI Architecture</text>

