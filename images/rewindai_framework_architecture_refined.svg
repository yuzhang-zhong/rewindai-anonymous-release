  <text class="pill-text" x="110" y="672" text-anchor="middle">Group 3</text>
  <text class="pill-text" x="110" y="693" text-anchor="middle">RewindAI</text>
  <text class="pill-text" x="110" y="714" text-anchor="middle">Clone</text>

  <rect class="node condition-anon" x="42" y="820" width="136" height="74"/>
  <text class="pill-text" x="110" y="851" text-anchor="middle">Anonymous</text>
  <text class="pill-text" x="110" y="872" text-anchor="middle">Experience</text>

  <path class="rail" d="M500 230 V248 H214 V858"/>
  <text class="edge-label" x="226" y="253">selects condition</text>
  <path class="edge" d="M214 386 H178"/>
  <path class="edge" d="M214 530 H178"/>
  <path class="edge" d="M214 686 H178"/>
  <path class="edge" d="M214 857 H178"/>
  <path class="edge" d="M214 386 H250 V286 H970 V230"/>
