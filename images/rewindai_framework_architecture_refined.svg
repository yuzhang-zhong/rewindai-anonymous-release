  <rect class="tab" x="62" y="130" width="230" height="32" fill="#e4f5ec"/>
  <circle cx="82" cy="146" r="13" fill="#2d775b"/>
  <text class="tab-num" x="78" y="151">1</text>
  <text class="section-label" x="104" y="151" fill="#2d775b">PARTICIPANT &amp; COCKPIT</text>

  <rect class="section section-ground" x="262" y="308" width="1040" height="250"/>
  <rect class="tab" x="282" y="326" width="260" height="32" fill="#eaf0ff"/>
  <circle cx="302" cy="342" r="13" fill="#3f63b5"/>
  <text class="tab-num" x="298" y="347">2</text>
  <text class="section-label" x="324" y="347" fill="#3f63b5">REWINDAI GROUNDING STACK</text>

  <rect class="section section-sim" x="262" y="600" width="1040" height="330"/>
  <rect class="tab" x="282" y="618" width="190" height="32" fill="#e4f6f7"/>
  <circle cx="302" cy="634" r="13" fill="#20737a"/>
  <text class="tab-num" x="298" y="639">3</text>
  <text class="section-label" x="324" y="639" fill="#20737a">SIMULATION LOOP</text>

  <rect class="section section-data" x="1350" y="360" width="190" height="530"/>
  <rect class="tab" x="1370" y="378" width="132" height="32" fill="#f1e9ff"/>
  <text class="section-label" x="1386" y="400" fill="#7c5ab8">STUDY DATA</text>

