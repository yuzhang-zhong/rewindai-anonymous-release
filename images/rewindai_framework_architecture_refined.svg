<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">RewindAI Architecture</title>
  <desc id="desc">A refined academic architecture figure for RewindAI, showing participant conditions, autobiographical grounding, public simulation-test loop, and privacy-aware research records.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#38424d"/>
    </marker>
    <marker id="arrowBlue" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#3f63b5"/>
    </marker>
    <marker id="arrowTeal" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#20737a"/>
    </marker>
    <marker id="arrowPurple" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#7c5ab8"/>
    </marker>
    <style>
      .title { font: 700 30px Arial, Helvetica, sans-serif; fill: #17211d; }
      .caption { font: 400 13px Arial, Helvetica, sans-serif; fill: #66736f; }
      .section { fill: #ffffff; stroke-width: 1.2; rx: 18; ry: 18; }
      .section-entry { stroke: #b6d7c5; }
      .section-ground { stroke: #bcccee; }
      .section-sim { stroke: #b7d7d9; }
      .section-data { stroke: #cebde9; }
      .section-label { font: 700 13px Arial, Helvetica, sans-serif; letter-spacing: 1.4px; }
      .tab { rx: 12; ry: 12; }
      .tab-num { font: 700 13px Arial, Helvetica, sans-serif; fill: #ffffff; }
      .node { stroke-width: 1.55; rx: 12; ry: 12; }
      .node-title { font: 700 16px Arial, Helvetica, sans-serif; fill: #15211d; }
      .node-sub { font: 400 11px Arial, Helvetica, sans-serif; fill: #5d6865; }
      .pill-text { font: 700 13px Arial, Helvetica, sans-serif; fill: #17211d; }
      .edge-label { font: 400 11px Arial, Helvetica, sans-serif; fill: #3f474f; }
      .note { font: 400 11px Arial, Helvetica, sans-serif; fill: #66716d; }
      .entry-node { fill: #f3fbf7; stroke: #3e8a67; }
      .condition-g1 { fill: #effaf4; stroke: #3e8a67; }
      .condition-g2 { fill: #edf3ff; stroke: #3f63b5; }
      .condition-g3 { fill: #f3ecff; stroke: #7c5ab8; }
      .condition-anon { fill: #f8f8f8; stroke: #9aa1a9; }
      .ground-node { fill: #f8fbff; stroke: #3f63b5; }
      .ground-fill { fill: #e9f0ff; stroke: #3f63b5; }
      .model-node { fill: #f4edff; stroke: #7c5ab8; }
      .sim-node { fill: #effafb; stroke: #20737a; }
      .trace-node { fill: #fff4d8; stroke: #bd7a23; }
      .data-node { fill: #f4edff; stroke: #7c5ab8; }
      .edge { fill: none; stroke: #38424d; stroke-width: 1.4; marker-end: url(#arrow); }
      .edge-blue { fill: none; stroke: #3f63b5; stroke-width: 1.45; marker-end: url(#arrowBlue); }
      .edge-teal { fill: none; stroke: #20737a; stroke-width: 1.45; marker-end: url(#arrowTeal); }
      .edge-purple { fill: none; stroke: #7c5ab8; stroke-width: 1.45; marker-end: url(#arrowPurple); }
      .edge-dash { fill: none; stroke: #66727e; stroke-width: 1.25; stroke-dasharray: 5 5; marker-end: url(#arrow); }
      .rail { fill: none; stroke: #d7dde2; stroke-width: 1.2; }
      .icon { fill: none; stroke: currentColor; stroke-width: 1.65; stroke-linecap: round; stroke-linejoin: round; opacity: .82; }
      .igreen { color: #34765a; }
      .iblue { color: #3f63b5; }
      .iteal { color: #20737a; }
      .ipurple { color: #7c5ab8; }
      .iamber { color: #bd7a23; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="#ffffff"/>
  <text class="title" x="44" y="54">RewindAI Architecture</text>
  <text class="caption" x="44" y="78">From autobiographical grounding to public simulation-test, reflection support, replay, and privacy-aware study records.</text>

