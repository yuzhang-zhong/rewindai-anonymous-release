  <path class="edge-blue" d="M493 443 H580"/>
  <text class="edge-label" x="512" y="430">writes</text>
  <path class="edge-blue" d="M736 443 H782 V384 H842"/>
  <text class="edge-label" x="762" y="375">extracts</text>
  <path class="edge-blue" d="M736 443 H782 V503 H842"/>
  <text class="edge-label" x="764" y="526">extracts</text>
  <path class="edge-blue" d="M1012 384 H1082 V456 H1140"/>
  <path class="edge-blue" d="M1042 503 H1082 V474 H1140"/>
  <text class="edge-label" x="1050" y="489">formulates</text>
  <path class="edge-blue" d="M1060 201 H1160 V426"/>
  <text class="edge-label" x="1096" y="292">launches</text>

