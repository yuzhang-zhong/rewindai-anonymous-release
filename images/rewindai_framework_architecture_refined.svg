  <circle class="icon igreen" cx="98" cy="190" r="6"/>
  <path class="icon igreen" d="M86 212 C89 202, 106 202, 110 212"/>
  <text class="node-title" x="120" y="207">Participant</text>

  <rect class="node entry-node" x="405" y="172" width="190" height="58"/>
  <path class="icon igreen" d="M426 188 h17 v22 h-17 z M431 196 h8 M431 204 h8"/>
  <text class="node-title" x="455" y="207">Group Assignment</text>

