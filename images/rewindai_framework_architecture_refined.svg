  <path class="edge" d="M595 201 H890"/>
  <text class="edge-label" x="717" y="189">full experience</text>

  <!-- Conditions -->
  <rect class="node condition-g1" x="42" y="348" width="136" height="76"/>
  <text class="pill-text" x="110" y="379" text-anchor="middle">Group 1</text>
  <text class="pill-text" x="110" y="400" text-anchor="middle">Self Reflection</text>

  <rect class="node condition-g2" x="42" y="486" width="136" height="88"/>
  <text class="pill-text" x="110" y="516" text-anchor="middle">Group 2</text>
  <text class="pill-text" x="110" y="537" text-anchor="middle">Generic AI</text>
  <text class="pill-text" x="110" y="558" text-anchor="middle">Reflection</text>

