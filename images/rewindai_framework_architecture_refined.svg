  <text class="node-title" x="1447" y="592" text-anchor="middle">Dataset</text>

  <rect class="node data-node" x="1388" y="748" width="118" height="106"/>
  <path class="icon ipurple" d="M1429 766 l18-10 l18 10 v17 c0 14-12 22-18 26 c-6-4-18-12-18-26 z"/>
