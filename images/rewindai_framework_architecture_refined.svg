  <path class="edge" d="M1096 714 V852 H1068"/>
  <text class="edge-label" x="1088" y="785">syncs trace</text>
  <path class="edge-teal" d="M814 861 H908"/>
  <text class="edge-label" x="835" y="846">replays</text>
  <path class="edge-teal" d="M1068 857 H1150"/>
  <path class="edge" d="M1226 890 V928 H752 V898"/>
  <text class="edge-label" x="1082" y="936">syncs trace</text>
  <path class="edge" d="M1282 857 H1350"/>
  <text class="edge-label" x="1288" y="838">aggregates</text>
  <path class="edge-dash" d="M672 482 V648 H700"/>
