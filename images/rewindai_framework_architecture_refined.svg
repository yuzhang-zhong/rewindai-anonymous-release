  <path class="edge" d="M178 857 H668"/>

  <!-- Data column -->
  <rect class="node data-node" x="1388" y="455" width="118" height="210"/>
  <path class="icon ipurple" d="M1424 492 c0 6, 36 6, 36 0 v48 c0 6-36 6-36 0 z M1424 510 c0 6, 36 6, 36 0"/>
