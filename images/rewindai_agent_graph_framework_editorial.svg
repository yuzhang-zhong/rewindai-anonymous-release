<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" viewBox="0 0 1120 680">
  <defs>
    <style>
      .bg { fill: #fbfaf4; }
      .ink { fill: #14362e; }
      .muted { fill: #5b6b65; }
      .hair { stroke: #d7dfd7; stroke-width: 1.6; }
      .stroke-green { stroke: #2d7a58; }
      .stroke-blue { stroke: #3867ad; }
      .stroke-amber { stroke: #b7791f; }
      .stroke-rose { stroke: #c84f79; }
      .title { font: 800 34px Arial, Helvetica, sans-serif; letter-spacing: -0.7px; fill: #14362e; }
      .subtitle { font: 500 18px Arial, Helvetica, sans-serif; fill: #64736e; }
      .kicker { font: 800 14px Arial, Helvetica, sans-serif; letter-spacing: 2.4px; }
      .card-title { font: 800 24px Arial, Helvetica, sans-serif; fill: #14362e; }
      .card-body { font: 500 17px Arial, Helvetica, sans-serif; fill: #53645f; }
      .node-title { font: 800 21px Arial, Helvetica, sans-serif; fill: #14362e; }
      .node-body { font: 600 15px Arial, Helvetica, sans-serif; fill: #5d6d67; }
      .chip { font: 800 15px Arial, Helvetica, sans-serif; fill: #17392f; }
      .tiny { font: 700 13px Arial, Helvetica, sans-serif; fill: #687872; }
      .arrow { stroke: #62716c; stroke-width: 3.4; fill: none; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .link { stroke: #6c7f78; stroke-width: 3; fill: none; stroke-linecap: round; }
      .dash { stroke-dasharray: 7 8; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#62716c"/>
    </marker>
  </defs>

  <rect class="bg" width="1120" height="680"/>

  <!-- quiet poster frame -->
  <path d="M42 112 H1078" class="hair"/>
  <path d="M42 594 H1078" class="hair"/>

  <text x="54" y="58" class="title">RewindAI Grounding Framework</text>
  <text x="54" y="88" class="subtitle">Agents turn natural stories into a relationship-decision graph for reflective decision support.</text>

  <!-- small evidence chips -->
  <rect x="748" y="42" width="136" height="38" rx="19" fill="#eef7f0" stroke="#b8d5bf" stroke-width="1.5"/>
  <text x="770" y="66" class="chip">interview evidence</text>
  <rect x="896" y="42" width="168" height="38" rx="19" fill="#f5f0ff" stroke="#c7b6ea" stroke-width="1.5"/>
  <text x="919" y="66" class="chip">tentative trace signals</text>

  <!-- left: agents -->
  <rect x="58" y="145" width="282" height="355" rx="34" fill="#edf7ef" stroke="#9bc9a8" stroke-width="2.2"/>
  <text x="90" y="186" class="kicker" fill="#2d7a58">AGENT FRAMEWORK</text>

  <g transform="translate(90 218)">
    <circle cx="26" cy="28" r="24" fill="#ffffff" stroke="#77b98c" stroke-width="2"/>
    <path d="M18 29 C18 18 34 18 34 29 M21 39 C25 34 30 34 34 39" stroke="#2d7a58" stroke-width="3" fill="none" stroke-linecap="round"/>
    <text x="68" y="25" class="node-title">Coordinator</text>
    <text x="68" y="50" class="card-body">selects three natural topics</text>
  </g>

  <g transform="translate(90 308)">
    <circle cx="26" cy="28" r="24" fill="#ffffff" stroke="#77b98c" stroke-width="2"/>
    <path d="M18 32 H34 M26 20 V43 M15 24 C19 18 33 18 37 24" stroke="#2d7a58" stroke-width="3" fill="none" stroke-linecap="round"/>
    <text x="68" y="25" class="node-title">Interviewer</text>
    <text x="68" y="50" class="card-body">mirrors and probes trade-offs</text>
  </g>

  <g transform="translate(90 398)">
    <circle cx="26" cy="28" r="24" fill="#ffffff" stroke="#77b98c" stroke-width="2"/>
    <path d="M17 17 H34 L39 22 V42 H17 Z M34 17 V23 H39 M22 29 H34 M22 35 H31" stroke="#2d7a58" stroke-width="2.7" fill="none" stroke-linecap="round"/>
    <text x="68" y="25" class="node-title">Writer</text>
    <text x="68" y="50" class="card-body">builds a decision-centered profile</text>
  </g>

  <!-- center: graph memory -->
  <rect x="415" y="130" width="318" height="390" rx="42" fill="#ffffff" stroke="#cdd9d3" stroke-width="2.2"/>
  <text x="452" y="175" class="kicker" fill="#3867ad">GRAPH FRAMEWORK</text>
  <text x="452" y="210" class="card-title">Graph Memory</text>
  <text x="452" y="238" class="card-body">Relationships, episodes, values,</text>
  <text x="452" y="261" class="card-body">constraints, and decision rules.</text>

  <!-- graph motif -->
  <g transform="translate(450 290)">
    <line x1="126" y1="80" x2="58" y2="42" class="link"/>
    <line x1="126" y1="80" x2="216" y2="42" class="link"/>
    <line x1="126" y1="80" x2="56" y2="138" class="link"/>
    <line x1="126" y1="80" x2="214" y2="138" class="link"/>
    <line x1="126" y1="80" x2="126" y2="168" class="link dash"/>

    <circle cx="126" cy="80" r="39" fill="#5cc469" stroke="#25703b" stroke-width="2.5"/>
    <text x="104" y="87" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="800" fill="#ffffff">Self</text>

    <circle cx="58" cy="42" r="28" fill="#67b7e6" stroke="#3476a0" stroke-width="2"/>
    <text x="16" y="7" class="node-body">relationships</text>

    <circle cx="216" cy="42" r="28" fill="#f0aa34" stroke="#a86a17" stroke-width="2"/>
    <text x="178" y="7" class="node-body">episodes</text>

    <circle cx="56" cy="138" r="28" fill="#df5d9c" stroke="#a13a6b" stroke-width="2"/>
    <text x="24" y="186" class="node-body">pressure</text>

    <circle cx="214" cy="138" r="28" fill="#865fe5" stroke="#5635a7" stroke-width="2"/>
    <text x="190" y="186" class="node-body">rules</text>

    <circle cx="126" cy="168" r="24" fill="#a8d957" stroke="#688f22" stroke-width="2"/>
    <text x="84" y="226" class="node-body">protected values</text>
  </g>

  <!-- right: reflection support -->
  <rect x="804" y="145" width="258" height="355" rx="34" fill="#f4f7ff" stroke="#aabfe9" stroke-width="2.2"/>
  <text x="836" y="186" class="kicker" fill="#3867ad">REFLECTION SUPPORT</text>

  <g transform="translate(836 226)">
    <rect x="0" y="0" width="194" height="76" rx="22" fill="#ffffff" stroke="#aabfe9" stroke-width="2"/>
    <text x="24" y="32" class="node-title">Mental Model</text>
    <text x="24" y="56" class="card-body">decision boundaries</text>
  </g>

  <g transform="translate(836 326)">
    <rect x="0" y="0" width="194" height="76" rx="22" fill="#ffffff" stroke="#aabfe9" stroke-width="2"/>
    <text x="24" y="32" class="node-title">Clone Dialogue</text>
    <text x="24" y="56" class="card-body">unchosen paths + impact</text>
  </g>

  <g transform="translate(836 426)">
    <rect x="0" y="0" width="194" height="52" rx="20" fill="#fff7e4" stroke="#d9bb62" stroke-width="2"/>
    <text x="24" y="34" class="node-title">Next Simulation</text>
  </g>

  <!-- main arrows -->
  <path d="M340 320 H407" class="arrow"/>
  <path d="M733 320 H796" class="arrow"/>
  <text x="358" y="303" class="tiny">profile evidence</text>
  <text x="748" y="303" class="tiny">grounded model</text>

  <!-- input strands to agents -->
  <g transform="translate(56 528)">
    <rect x="0" y="0" width="220" height="42" rx="21" fill="#ffffff" stroke="#b8d5bf" stroke-width="1.8"/>
    <text x="22" y="27" class="chip">Stories</text>
    <circle cx="104" cy="21" r="4" fill="#9fc9ad"/>
    <text x="122" y="27" class="chip">Traces</text>
  </g>
  <path d="M276 549 C318 549 338 505 338 470" class="arrow"/>

  <!-- baseline strip -->
  <g transform="translate(222 614)">
    <text x="0" y="25" class="tiny">Baseline conditions</text>
    <rect x="158" y="0" width="110" height="38" rx="19" fill="#edf7ef" stroke="#b8d5bf" stroke-width="1.5"/>
    <text x="184" y="25" class="chip">self notes</text>
    <rect x="282" y="0" width="126" height="38" rx="19" fill="#edf7ef" stroke="#b8d5bf" stroke-width="1.5"/>
    <text x="306" y="25" class="chip">generic AI</text>
    <rect x="422" y="0" width="138" height="38" rx="19" fill="#edf7ef" stroke="#b8d5bf" stroke-width="1.5"/>
    <text x="447" y="25" class="chip">clone support</text>
    <rect x="574" y="0" width="132" height="38" rx="19" fill="#edf7ef" stroke="#b8d5bf" stroke-width="1.5"/>
    <text x="598" y="25" class="chip">anonymous</text>
  </g>
</svg>
